<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>אישור מנויים | בראשית</title><style>*{box-sizing:border-box}body{margin:0;background:#100b0c;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 14px}.head,.item{background:#1a1516;border:1px solid #553039;border-radius:15px;padding:16px;margin-bottom:12px}.muted{color:#aaa;line-height:1.6}.title{font-size:24px;font-weight:900;margin-bottom:6px}.item img{display:block;width:100%;max-height:420px;object-fit:contain;background:#080808;border-radius:10px;margin:12px 0}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px;border:0;border-radius:9px;font-weight:bold;color:white;background:#16834b}.actions .reject{background:#842632}.actions button:disabled{opacity:.5}.empty{padding:25px;text-align:center;color:#aaa}#status{margin:10px 0;color:#ff9da7}</style></head><body><div class="wrap"><div class="head"><div class="title">☕ אישור דיווחי מנויים</div><div class="muted" id="branch">טוען קישור מנהל...</div><div class="muted">בדקו את צילום הקבלה. רק אישור יוסיף מנוי לדירוג.</div></div><div id="status"></div><div id="list"></div></div><script>(()=>{const key=new URLSearchParams(location.search).get('key')||'';const $=id=>document.getElementById(id);async function api(url,options={}){const r=await fetch(url,{...options,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({error:'שגיאת שרת'}));if(!r.ok)throw Error(d.error||'שגיאת שרת');return d}async function load(){try{const d=await api('/api/review?key='+encodeURIComponent(key));$('branch').textContent='סניף: '+d.branch+' · '+d.items.length+' דיווחים ממתינים';$('list').innerHTML=d.items.length?d.items.map(x=>'<article class="item" data-id="'+x.id+'"><b>'+x.employee+'</b><div class="muted">'+new Date(x.created_at).toLocaleString('he-IL')+'</div><img alt="קבלה" src="/api/pending-receipt?key='+encodeURIComponent(key)+'&id='+x.id+'"><div class="actions"><button data-action="approve">אישור והוספת מנוי</button><button class="reject" data-action="reject">דחייה</button></div></article>').join(''):'<div class="empty">אין דיווחים שממתינים לאישור 🎉</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const card=b.closest('[data-id]');card.querySelectorAll('button').forEach(x=>x.disabled=true);try{await api('/api/review?key='+encodeURIComponent(key),{method:'POST',body:JSON.stringify({id:Number(card.dataset.id),action:b.dataset.action})});$('status').textContent=b.dataset.action==='approve'?'הדיווח אושר והמנוי נוסף.':'הדיווח נדחה.';await load()}catch(e){$('status').textContent=e.message;card.querySelectorAll('button').forEach(x=>x.disabled=false)}});}catch(e){$('branch').textContent=e.message;$('list').innerHTML=''}}load();setInterval(load,30000)})();</script></body></html>
