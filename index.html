<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="application-name" content="קליית בראשית"><meta name="apple-mobile-web-app-title" content="קליית בראשית">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/coffee-champions.svg"><link rel="icon" type="image/svg+xml" href="/assets/coffee-champions.svg">
<title>מנויים | קליית בראשית</title>
<style>
:root{--red:#e32636;--line:#383838}*{box-sizing:border-box;min-width:0}html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:radial-gradient(ellipse at top,#281015,#090909 56%);color:#f5f5f5;font-family:Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:27px 14px 20px;background:#090909;border-bottom:1px solid #632630}.brand{font-size:25px;font-weight:900}.eyebrow{margin-top:8px;color:#ff6974;font-size:11px;letter-spacing:4px;font-weight:bold}h1{font-size:clamp(27px,6vw,40px);margin:10px 0 4px}h1 span{color:#f04452}.sub,.note{color:#aaa;font-size:14px;line-height:1.6}
main{width:min(760px,100%);margin:auto;padding:18px 13px 50px}.panel,.employee-card{background:linear-gradient(145deg,#1b1b1b,#111);border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}
label{display:block;color:#bbb;font-size:14px;margin:12px 0 6px}input,select{display:block;width:100%;padding:13px;background:#090909;color:#fff;border:1px solid #484848;border-radius:9px;font-size:16px}input[type=file]{font-size:13px}
button{border:0;border-radius:10px;padding:13px 16px;background:var(--red);color:#fff;font-weight:bold;font-size:16px;cursor:pointer;width:100%;margin-top:15px}button:disabled{opacity:.55}
.branch-title{font-size:23px;font-weight:900}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.summary strong{font-size:27px;color:#ff5967}.divider{height:1px;background:#333;margin:15px 0}
.employees{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.employee-card{margin:0;padding:13px}.employee-name{font-weight:900;font-size:17px}.employee-count{font-size:26px;color:#ff5967;font-weight:900;margin-top:9px}.updated{font-size:11px;color:#999;margin-top:7px}.receipt-link{background:none;border:0;color:#ff9aa2;text-decoration:underline;padding:5px 0;width:auto;margin:8px 0 0;font-size:13px}
.notice{display:none;padding:12px;margin:12px 0;border:1px solid #80323c;border-radius:10px;background:#281418;color:#ffe1e4;line-height:1.5}.modal{position:fixed;z-index:10;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:15px}.dialog{width:min(500px,100%);padding:16px;border:1px solid #a33b47;border-radius:16px;background:#171717}.dialog img{display:block;max-width:100%;max-height:70dvh;object-fit:contain;margin:12px auto}.hidden{display:none!important}
@media(max-width:560px){.employees{grid-template-columns:1fr}header{padding-top:22px}main{padding-left:10px;padding-right:10px}}
</style></head><body>
<header><div class="brand">קליית בראשית</div><div class="eyebrow">COFFEE CHAMPIONS</div><h1>ניהול <span>מנויים</span></h1><div class="sub">עדכון אישי לעובדי ביתר עילית</div></header>
<main>
<div id="notice" class="notice" role="status"></div>
<section class="panel">
 <div class="branch-title">דיווח מנויים</div>
 <div class="note">בחרו סניף ואת השם שלכם, עדכנו את מספר המנויים והוסיפו צילום קבלה.</div>
 <label for="branch">הסניף שלי</label><select id="branch"><option value="ביתר עילית A">ביתר עילית A</option><option value="ביתר עילית B">ביתר עילית B</option></select>
 <label for="employee">השם שלי</label><select id="employee"><option value="">בחירת עובד</option><option>יהודה בן גיגי</option><option>נהוראי מלכה</option><option>אוריאל דוד פנחסי</option><option>ישי אלמקייס</option></select>
 <label for="count">מספר המנויים שלי (סה״כ מעודכן)</label><input id="count" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="לדוגמה: 12">
 <label for="receipt">צילום קבלה (לא חובה בכל עדכון)</label><input id="receipt" type="file" accept="image/*" capture="environment">
 <button id="save">שמירת העדכון שלי</button>
</section>
<section class="panel">
 <div class="summary"><div><div class="note">התקדמות הסניף</div><div class="branch-title" id="branchTitle">ביתר עילית A</div></div><div><div class="note">סה״כ מנויים</div><strong id="total">0</strong></div></div>
 <div class="divider"></div><div class="employees" id="employees"></div>
</section>
</main>
<section id="modal" class="modal hidden"><div class="dialog"><div class="summary"><strong id="modalTitle">קבלה</strong><button id="close" style="width:auto;margin:0;background:#333">סגירה</button></div><img id="receiptImage" alt="צילום קבלה"></div></section>
<script>
(()=>{'use strict';
const BRANCHES=['ביתר עילית A','ביתר עילית B'],EMPLOYEES=['יהודה בן גיגי','נהוראי מלכה','אוריאל דוד פנחסי','ישי אלמקייס'];
const $=id=>document.getElementById(id);let rows=[];
function notice(s){$('notice').textContent=s;$('notice').style.display='block'}function clear(){ $('notice').style.display='none' }
async function api(path,options={}){const r=await fetch('/api/'+path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({error:'שגיאת שרת'}));if(!r.ok)throw Error(d.error||'שגיאת שרת');return d}
async function load(){clear();const branch=$('branch').value;try{
 const d=await api('reports?branch='+encodeURIComponent(branch));rows=d.employees||[];$('branchTitle').textContent=branch;$('total').textContent=rows.reduce((n,r)=>n+Number(r.subscriptions||0),0).toLocaleString('he-IL');
 $('employees').innerHTML=rows.map((r,i)=>'<article class="employee-card"><div class="employee-name">'+r.employee+'</div><div class="employee-count">'+Number(r.subscriptions||0).toLocaleString('he-IL')+' מנויים</div>'+(r.has_receipt?'<button class="receipt-link" data-receipt="'+i+'">צפייה בקבלה</button>':'<div class="updated">טרם הועלתה קבלה</div>')+(r.updated_at?'<div class="updated">עודכן: '+new Date(r.updated_at).toLocaleString('he-IL')+'</div>':'')+'</article>').join('');
 document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>viewReceipt(Number(b.dataset.receipt)));
 }catch(e){notice(e.message)}}
function compress(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('יש לבחור תמונה.'));if(file.size>15*1024*1024)return reject(Error('התמונה גדולה מדי, עד 15MB.'));const url=URL.createObjectURL(file),img=new Image();img.onload=async()=>{try{let scale=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),blob;for(let i=0;i<7;i++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);blob=await new Promise(res=>c.toBlob(res,'image/jpeg',[.78,.68,.58,.5,.44,.4,.36][i]));if(blob&&blob.size<=850*1024)break;scale*=.82}URL.revokeObjectURL(url);if(!blob||blob.size>850*1024)return reject(Error('לא ניתן לדחוס את התמונה. נסה צילום קטן יותר.'));resolve(blob)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('לא ניתן לפתוח את התמונה.'))};img.src=url})}
function base64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=()=>reject(Error('לא ניתן לקרוא את התמונה'));r.readAsDataURL(blob)})}
$('save').onclick=async()=>{clear();const branch=$('branch').value,employee=$('employee').value,count=Number($('count').value),file=$('receipt').files[0];if(!BRANCHES.includes(branch)||!EMPLOYEES.includes(employee))return notice('בחרו את הסניף ואת השם שלכם.');if(!Number.isInteger(count)||count<0||count>100000)return notice('יש להזין מספר מנויים שלם ותקין.');const b=$('save');b.disabled=true;b.textContent='שומר...';try{const receipt=file?await base64(await compress(file)):null;await api('report',{method:'POST',body:JSON.stringify({branch,employee,subscriptions:count,receipt})});$('receipt').value='';notice('העדכון נשמר בהצלחה, '+employee+'!');await load()}catch(e){notice(e.message)}finally{b.disabled=false;b.textContent='שמירת העדכון שלי'}};
async function viewReceipt(i){const row=rows[i];try{const p=new URLSearchParams({branch:$('branch').value,employee:row.employee}),d=await api('receipt?'+p);$('modalTitle').textContent='קבלה – '+row.employee;$('receiptImage').src='data:'+(d.type||'image/jpeg')+';base64,'+d.data;$('modal').classList.remove('hidden')}catch(e){notice(e.message)}}
$('branch').onchange=()=>{ $('employee').value='';$('count').value='';$('receipt').value='';load()};$('close').onclick=()=>{$('modal').classList.add('hidden');$('receiptImage').removeAttribute('src')};$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};
load();
})();
</script></body></html>
