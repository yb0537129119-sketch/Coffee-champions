<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0df"><title>סיכום משימות יומי | קליית בראשית</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0df;color:#302b20;font-family:Arial,sans-serif}header{background:#fffaf0;border-bottom:2px solid #d5bd79;padding:22px 14px;text-align:center}header strong{font-size:25px}header div{color:#8c6a20;margin-top:7px;font-size:12px;letter-spacing:2px}main{width:min(1000px,100%);margin:auto;padding:16px 12px 45px}.tools,.stats,.task{background:#fffdf6;border:1px solid #dfd2ad;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #6b54200d}.tools{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.tools label{display:block;font-weight:bold;margin-bottom:7px}.tools input{padding:12px;border:1px solid #cdbd91;border-radius:9px;background:white;font-size:17px}.hint{color:#74684f;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f0dd;border-radius:11px;padding:13px;text-align:center}.stat span{display:block;color:#716448;font-size:14px}.stat strong{display:block;font-size:30px;margin-top:4px;color:#8e6c1e}.progress{height:12px;background:#e7dcc0;border-radius:20px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:linear-gradient(90deg,#a98224,#e0c35e);width:0}.task{padding:16px}.task h3{margin:0 0 8px;font-size:19px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:#685a3a;font-size:14px}.pill{background:#f1e8cf;padding:6px 9px;border-radius:20px}.status{font-weight:bold}.done{color:#28643b}.open{color:#96620d}.detail{white-space:pre-wrap;line-height:1.55;color:#625943;margin-top:8px}.empty{text-align:center;padding:25px;color:#74684f}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.topline button{border:1px solid #a98224;background:#dfc15c;border-radius:9px;padding:10px 13px;font-weight:bold;font-size:14px}@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px 5px}.stat strong{font-size:25px}.task h3{font-size:17px}}
</style></head><body><header><strong>קליית בראשית · סיכום משימות</strong><div>COFFEE CHAMPIONS</div></header><main>
<div class="tools"><div><label for="day">בחירת יום</label><input id="day" type="date"></div><div class="hint">הסיכום מתעדכן אוטומטית כל 15 שניות · כל הסניפים</div></div>
<div class="stats"><div class="stat"><span>סה״כ משימות</span><strong id="total">—</strong></div><div class="stat"><span>הושלמו</span><strong id="done">—</strong></div><div class="stat"><span>פתוחות</span><strong id="open">—</strong></div></div>
<div class="tools" style="display:block"><div class="topline"><strong>התקדמות יומית</strong><span id="percent">—</span></div><div class="progress"><div id="bar"></div></div><div class="hint" id="updated" style="margin-top:9px">טוען נתונים…</div></div>
<div id="list"><div class="empty">טוען משימות…</div></div>
</main><script>
const $=id=>document.getElementById(id);const localDay=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateLabel=s=>{if(!s)return'ללא תאריך יעד';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
async function load(){const day=$('day').value||localDay();try{const r=await fetch('/api/tasks?branch=all&day='+encodeURIComponent(day),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'לא ניתן לטעון נתונים');const tasks=d.tasks||[],done=tasks.filter(t=>t.status==='done').length,open=tasks.length-done,pct=tasks.length?Math.round(done/tasks.length*100):0;$('total').textContent=tasks.length;$('done').textContent=done;$('open').textContent=open;$('percent').textContent=pct+'% הושלמו';$('bar').style.width=pct+'%';$('updated').textContent='עודכן לאחרונה: '+new Date().toLocaleTimeString('he-IL');$('list').innerHTML=tasks.length?tasks.map(t=>'<article class="task"><h3>'+esc(t.title)+'</h3>'+(t.details?'<div class="detail">'+esc(t.details)+'</div>':'')+(t.employee_note?'<div class="detail"><strong>הערת עובד:</strong> '+esc(t.employee_note)+'</div>':'')+'<div class="meta"><span class="pill">'+esc(t.branch)+'</span><span class="pill">👤 '+esc(t.assignee||'לא הוגדר')+'</span><span class="pill">יעד: '+dateLabel(t.due_date)+'</span><span class="pill status '+(t.status==='done'?'done':'open')+'">'+(t.status==='done'?'✓ הושלמה':'● פתוחה')+'</span>'+(t.status==='done'?'<span class="pill">בוצעה על ידי: '+esc(t.completed_by||'לא צוין')+'</span>':'')+'</div></article>').join(''):'<div class="empty">אין משימות לתאריך שנבחר.</div>'}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('day').value=localDay();$('day').addEventListener('change',load);load();setInterval(load,15000);
</script></body></html>
